<meta charset="utf-8">

<meta name="description" content="Досуговый марафон: тесты по курсу культурно-досуговой деятельности. Результаты приходят преподавателю.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>Досуговый марафон</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one centred page of a squared school notebook with a red margin line at left; grades are written in a teacher's red pen on a 10-point scale */
:root {
  --paper: #FBFBF6;
  --grid: rgba(64, 104, 190, 0.14);
  --margin: #E0574F;
  --ink: #1A2C6B;
  --ink-soft: #4C5A88;
  --card: #FFFFFF;
  --line: #D3DAEA;
  --pen: #C2202B;
  --pen-tint: rgba(194, 32, 43, 0.08);
  --good: #1D7448;
  --good-tint: rgba(29, 116, 72, 0.09);
  --on-ink: #FBFBF6;
  --focus: #E0574F;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1626; --grid: rgba(130, 160, 235, 0.10); --margin: #9E3D3C;
    --ink: #DDE5FF; --ink-soft: #9DAAD3; --card: #162036; --line: #2A3655;
    --pen: #FF6B70; --pen-tint: rgba(255, 107, 112, 0.12);
    --good: #4CC890; --good-tint: rgba(76, 200, 144, 0.12);
    --on-ink: #0F1626; --focus: #FF8A8E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1626; --grid: rgba(130, 160, 235, 0.10); --margin: #9E3D3C;
  --ink: #DDE5FF; --ink-soft: #9DAAD3; --card: #162036; --line: #2A3655;
  --pen: #FF6B70; --pen-tint: rgba(255, 107, 112, 0.12);
  --good: #4CC890; --good-tint: rgba(76, 200, 144, 0.12);
  --on-ink: #0F1626; --focus: #FF8A8E;
  color-scheme: dark;
}

body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.page {
  max-width: 720px;
  margin: 0 auto;
  position: relative;
  padding-left: 30px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.page::before {
  content: "";
  position: absolute;
  left: 8px;
  top: -28px;
  bottom: -56px;
  width: 2px;
  background: var(--margin);
}

h1, h2, h3, p { margin: 0; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 7vw, 46px);
  line-height: 1.08;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(19px, 4.4vw, 24px);
  line-height: 1.2;
  text-wrap: balance;
}
.eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.lede { font-size: 18px; color: var(--ink-soft); max-width: 60ch; }
.hero { display: flex; flex-direction: column; gap: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
.field label { font-size: 14px; font-weight: 600; color: var(--ink-soft); }
.field input {
  font: 500 17px var(--font-body);
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}

/* Ledger (the grade sheet) */
.ledger { display: flex; flex-direction: column; }
.ledger-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 10px; border-bottom: 2px solid var(--ink);
}
.ledger-head span { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) 64px auto;
  align-items: center;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.row .num { font-family: var(--font-display); font-weight: 500; font-size: 18px; color: var(--ink-soft); }
.row .topic { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .lec { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.row .name { font-weight: 600; font-size: 17px; }
.row .meta { font-size: 14px; color: var(--ink-soft); }
.markcell { text-align: center; }
.mark-sm {
  display: inline-block;
  font-family: var(--font-hand);
  font-weight: 700;
  font-size: 40px;
  line-height: 1;
  color: var(--pen);
  transform: rotate(-8deg);
}
.mark-empty { color: var(--line); font-size: 22px; }

.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
  font: 600 16px var(--font-body);
  background: var(--ink);
  color: var(--on-ink);
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  padding: 11px 18px;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }
.linkbtn {
  font: 600 15px var(--font-body);
  background: none; border: 0; color: var(--ink-soft);
  cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.howto { font-size: 15px; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; }
.howto strong { color: var(--ink); }

/* Station */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.score { font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ink); transition: width 0.3s ease; }
.steplabel { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.sheet {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: clamp(18px, 4vw, 28px);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.question { font-size: clamp(18px, 4.2vw, 21px); font-weight: 600; line-height: 1.35; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  font: 500 16px/1.4 var(--font-body);
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 13px 16px;
  cursor: pointer;
}
.opt:hover:not([disabled]) { border-color: var(--ink-soft); }
.opt[disabled] { cursor: default; }
.opt .tag { font-size: 13px; font-weight: 600; white-space: nowrap; }
.opt.correct { border-color: var(--good); background: var(--good-tint); }
.opt.correct .tag { color: var(--good); }
.opt.wrong { border-color: var(--pen); background: var(--pen-tint); }
.opt.wrong .tag { color: var(--pen); }
.feedback { font-size: 16px; padding: 12px 14px; border-radius: 8px; border-left: 4px solid var(--good); background: var(--good-tint); }
.feedback.bad { border-left-color: var(--pen); background: var(--pen-tint); }
.feedback strong { display: block; margin-bottom: 2px; }

.itemcard {
  border: 1.5px dashed var(--ink-soft);
  border-radius: 10px;
  padding: 18px;
  text-align: center;
  font-size: clamp(18px, 4.5vw, 22px);
  font-weight: 600;
  line-height: 1.3;
}
.bins { display: grid; gap: 10px; }
.bins-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bins-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.bin {
  display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
  text-align: left;
  font: 600 16px var(--font-body);
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  min-width: 0;
}
.bin small { font-weight: 400; font-size: 14px; color: var(--ink-soft); line-height: 1.3; }
.bin:hover:not([disabled]) { border-color: var(--ink-soft); }
.bin[disabled] { cursor: default; }
.bin.correct { border-color: var(--good); background: var(--good-tint); }
.bin.wrong { border-color: var(--pen); background: var(--pen-tint); }

.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: slot; }
.slot {
  counter-increment: slot;
  display: flex; align-items: center; gap: 12px;
  min-height: 46px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1.5px dashed var(--line);
  color: var(--ink-soft);
  font-weight: 500;
}
.slot::before {
  content: counter(slot);
  font-family: var(--font-display);
  font-size: 15px;
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1.5px solid currentColor;
}
.slot.filled { border-style: solid; border-color: var(--good); background: var(--good-tint); color: var(--ink); font-weight: 600; }
.slot.filled::before { color: var(--good); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 600 15px var(--font-body);
  color: var(--ink);
  background: var(--card);
  border: 1.5px solid var(--ink-soft);
  border-radius: 999px;
  padding: 9px 15px;
  cursor: pointer;
}
.chip.wrong { border-color: var(--pen); color: var(--pen); animation: shake 0.35s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* Grade with red-pen ring */
.grade { position: relative; width: 132px; height: 132px; display: grid; place-items: center; flex: none; }
.grade svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.grade .ring { fill: none; stroke: var(--pen); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 0; animation: draw 0.9s ease-out; }
.grade span { font-family: var(--font-hand); font-weight: 700; font-size: 84px; line-height: 1; color: var(--pen); transform: rotate(-8deg); }
@keyframes draw { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
.result { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.result-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 260px; }
.handnote { font-family: var(--font-hand); font-weight: 600; font-size: 28px; line-height: 1.15; color: var(--pen); }

/* Final ledger */
.cert-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.cert-table th, .cert-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cert-table th { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; border-bottom: 2px solid var(--ink); }
.cert-table td:last-child, .cert-table th:last-child { text-align: center; width: 80px; }
.cert-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); }

@media (max-width: 560px) {
  .page { padding-left: 22px; }
  .page::before { left: 4px; }
  .row { grid-template-columns: 24px minmax(0, 1fr) 52px; }
  .row .btn { grid-column: 2 / -1; justify-self: start; }
  .bins-3 { grid-template-columns: 1fr; }
  .grade { width: 112px; height: 112px; }
  .grade span { font-size: 70px; }
}
.who { display: flex; flex-direction: column; gap: 10px; }
.namegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 560px; }
.namegrid .field { max-width: none; }
.req { color: var(--pen); }
input[aria-invalid="true"] { border-color: var(--pen); }
.formerror { color: var(--pen); font-weight: 600; font-size: 15px; }
.sendok { color: var(--good); font-weight: 600; }
.sending { color: var(--ink-soft); }
.senderr { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; border-left: 4px solid var(--pen); background: var(--pen-tint); }
@media (max-width: 560px) { .namegrid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>

  var S = { view: "home", firstName: "", lastName: "", results: {}, attempts: {}, run: null, last: null, pendingStation: -1, nameError: "" };

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === "object") {
          S.firstName = typeof d.firstName === "string" ? d.firstName : "";
          S.lastName = typeof d.lastName === "string" ? d.lastName : "";
          S.attempts = d.attempts && typeof d.attempts === "object" ? d.attempts : {};
          S.results = d.results && typeof d.results === "object" ? d.results : {};
        }
      }
    } catch (e) { /* storage unavailable */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ firstName: S.firstName, lastName: S.lastName, results: S.results, attempts: S.attempts })); } catch (e) { /* ignore */ }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function stationMax(st) {
    return st.quiz.length * Q_PTS;
  }
  function stepsTotal(st) { return st.quiz.length + (st.game ? 1 : 0); }
  function toMark(points, max) { return Math.max(0, Math.min(10, Math.round(points / max * 10))); }
  function gameTotal(g) { return g.type === "bins" ? g.items.length : g.steps.length; }
  function markWord(m) {
    if (m >= 10) return "Блестяще! Хоть сейчас веди этот курс сам.";
    if (m >= 8) return "Очень хорошо — почти без ошибок.";
    if (m >= 6) return "Хорошо. Стоит перечитать пару разделов лекции.";
    if (m >= 4) return "Есть пробелы: вернитесь к тексту лекции и попробуйте снова.";
    return "Перечитайте лекцию и пройдите станцию ещё раз.";
  }
  function rankTitle(avg) {
    var r = Math.round(avg);
    if (r >= 9) return "Педагог-организатор высшей категории";
    if (r >= 7) return "Педагог-организатор первой категории";
    if (r >= 5) return "Педагог-организатор второй категории";
    return "Стажёр: перечитайте лекции и попробуйте снова";
  }
  function doneCount() {
    var n = 0;
    STATIONS.forEach(function (st) { if (S.results[st.id]) n++; });
    return n;
  }

  var NAME_RE = /^[A-Za-zА-Яа-яЁёІіЎў'’ -]{2,40}$/;
  function cleanName(v) { return String(v || "").replace(/\s+/g, " ").trim(); }
  function nameValid(v) { return NAME_RE.test(cleanName(v)); }
  function nameOk() { return nameValid(S.firstName) && nameValid(S.lastName); }
  function fullName() { return cleanName(S.lastName) + " " + cleanName(S.firstName); }
  function testLabel(st) { return "Тест " + st.id.slice(1); }
  function nameFields() {
    var badLast = S.nameError && !nameValid(S.lastName);
    var badFirst = S.nameError && !nameValid(S.firstName);
    return '<div class="namegrid">' +
        '<div class="field"><label for="last-name">Фамилия <span class="req">*</span></label>' +
          '<input id="last-name" type="text" autocomplete="family-name" maxlength="40" required' + (badLast ? ' aria-invalid="true"' : '') + ' value="' + esc(S.lastName) + '"></div>' +
        '<div class="field"><label for="first-name">Имя <span class="req">*</span></label>' +

      (S.nameError ? '<p class="formerror" role="alert">' + esc(S.nameError) + '</p>' : '');

  function buildReport(st, run, mark, game, attempt) {
    var okCount = run.answers.filter(function (a) { return a.ok; }).length;
    var when = "";
    try { when = new Date().toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { when = ""; }
    var d = {};
    d._subject = "Досуговый марафон · " + testLabel(st) + " · " + fullName() + " · отметка " + mark + " из 10";
    d._template = "table";
    d._captcha = "false";
    d._cc = MAIL_CC;
    d["Ученик"] = fullName();
    d["Тест"] = testLabel(st) + ". " + st.title;
    d["ИТОГ"] = run.points + " из " + stationMax(st) + " баллов — отметка " + mark + " из 10";
    d["Верных ответов"] = okCount + " из " + st.quiz.length;
    d["Попытка"] = String(attempt);
    d["Дата и время"] = when;
    run.answers.forEach(function (a, i) {
      d["Вопрос " + (i + 1)] = (a.ok ? "✅ ВЕРНО (+" + Q_PTS + " балла). " : "❌ ОШИБКА (0 баллов). ") +
        "Вопрос: " + a.q + " | Ответ ученика: «" + a.picked + "»" +
        (a.ok ? "" : " | Правильный ответ: «" + a.correct + "»");
    });
    if (game) d["Тренировка (на отметку не влияет)"] = "верно " + game.ok + " из " + game.total;
    return d;
  }

  function sendLast() {
    var L = S.last;
    if (!L || !L.report) return;
    L.send = "sending";
    L.sendMsg = "";
    if (S.view === "result") render();
    var finished = false;
    function finish(state) {
      if (finished) return;
      finished = true;
      L.send = state;
      if (S.view === "result") render();
    }
    try {
      // Обычная отправка формы в скрытый фрейм: так FormSubmit работает без ограничений браузера.
      var frameName = "fs_" + Date.now();
      var frame = document.createElement("iframe");
      frame.name = frameName;
      frame.setAttribute("aria-hidden", "true");
      frame.style.cssText = "position:absolute;width:0;height:0;border:0;left:-9999px";
      document.body.appendChild(frame);
      var form = document.createElement("form");
      form.method = "POST";
      form.action = MAIL_FORM;
      form.target = frameName;
      form.acceptCharset = "UTF-8";
      form.style.display = "none";
      Object.keys(L.report).forEach(function (k) {
        var inp = document.createElement("input");
        inp.type = "hidden";
        inp.name = k;
        inp.value = L.report[k];
        form.appendChild(inp);
      });
      document.body.appendChild(form);
      var timer = setTimeout(function () { L.sendMsg = "сервер не ответил за 30 секунд"; finish("error"); }, 30000);
      form.submit();
      frame.addEventListener("load", function () { clearTimeout(timer); finish("ok"); });
      setTimeout(function () {
        if (form.parentNode) form.parentNode.removeChild(form);
        if (frame.parentNode) frame.parentNode.removeChild(frame);
      }, 60000);
    } catch (e) {
      L.sendMsg = String(e && e.message || e);
      finish("error");
    }
  }

  function topbar(st, run) {
    var total = stepsTotal(st);
    var frac = run.step;
    var g = st.game;
    if (run.step >= st.quiz.length && g) {
      var part = g.type === "bins" ? run.item / g.items.length : run.placed.length / g.steps.length;
      frac = st.quiz.length + part;
    }
    var pct = Math.round(frac / total * 100);
    return '' +
      '<div class="topbar">' +
        (LOCKED >= 0 ? '<span></span>' : '<button class="linkbtn" data-action="home">← К ведомости</button>') +
        '<span class="score">Баллы: ' + run.points + ' из ' + stationMax(st) + '</span>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
        '<p class="eyebrow">' + esc(testLabel(st)) + ' · ' + esc(fullName()) + '</p>' +
        '<h2>' + esc(st.title) + '</h2>' +

      '</div>';
  }

  function viewQuiz(st, run) {
    var item = st.quiz[run.step];
    var opts = run.opts[run.step];
    var answered = run.picked !== null;
    var optsHTML = opts.map(function (o, k) {
      var cls = "opt", tag = "";
      if (answered) {
        if (o === item.a) { cls += " correct"; tag = "Верно"; }
        else if (o === run.picked) { cls += " wrong"; tag = "Ваш ответ"; }
      }
      return '<button class="' + cls + '" data-action="pick" data-k="' + k + '"' + (answered ? ' disabled' : '') + '><span>' + esc(o) + '</span>' + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</button>';
    }).join("");
    var fb = "";

      fb = '<div class="feedback' + (ok ? '' : ' bad') + '"><strong>' + (ok ? 'Верно, +2 балла' : 'Неверно') + '</strong>' + esc(item.explain) + '</div>' +

  }

  function viewOrder(st, run) {
    var g = st.game;
    var slots = g.steps.map(function (s, k) {
      var filled = k < run.placed.length;
      return '<li class="slot' + (filled ? ' filled' : '') + '">' + (filled ? esc(g.steps[run.placed[k]]) : 'Стадия ' + (k + 1) + '…') + '</li>';
    }).join("");
    var pool = run.pool.filter(function (k) { return run.placed.indexOf(k) < 0; }).map(function (k) {
      return '<button class="chip' + (run.wrongTap === k ? ' wrong' : '') + '" data-action="place" data-k="' + k + '">' + esc(g.steps[k]) + '</button>';
    }).join("");
    var complete = run.placed.length === g.steps.length;
    var fb = "";
    if (complete) {
      fb = '<div class="feedback"><strong>Цикл собран</strong>Последействие замыкает круг: предложения детей становятся замыслом следующего дела.</div>' +
        '<div class="actions"><button class="btn" id="next-btn" data-action="finish">Завершить станцию</button></div>';
    } else if (run.wrongTap !== null) {
      fb = '<div class="feedback bad"><strong>Не эта стадия</strong>Подумайте, что должно произойти раньше.</div>';
    }
    return topbar(st, run) +
      '<p class="steplabel">Тренировка · ' + esc(g.title) + '</p>' +
      '<section class="sheet">' +
        '<p class="steplabel">' + esc(g.hint) + '</p>' +
        '<ol class="slots">' + slots + '</ol>' +
        (complete ? '' : '<div class="pool">' + pool + '</div>') + fb +
      '</section>';
  }

  function sendStatus(L) {
    if (L.send === "ok") return '<p class="sendok" role="status">✓ Результат отправлен преподавателю</p>';
    if (L.send === "error") return '<div class="senderr" role="alert"><p>Не удалось отправить результат преподавателю. Проверьте интернет и нажмите кнопку ещё раз.</p>' +
      (L.sendMsg ? '<p class="steplabel">Ответ сервера: ' + esc(L.sendMsg) + '</p>' : '') +
      '<button class="btn" data-action="resend">Отправить ещё раз</button></div>';
    return '<p class="sending" role="status">Отправляем результат преподавателю…</p>';
  }

  function viewResult() {
    var L = S.last, st = STATIONS[L.i];
    var next = -1;
    for (var k = 1; k <= STATIONS.length; k++) {
      var c = (L.i + k) % STATIONS.length;
      if (!S.results[STATIONS[c].id]) { next = c; break; }
    }
    return '' +
      '<p class="eyebrow">' + esc(testLabel(st)) + ' пройден · ' + esc(fullName()) + '</p>' +
      '<h2>' + esc(st.title) + '</h2>' +
      '<section class="sheet">' +
        '<div class="result">' + gradeHTML(L.mark) +
          '<div class="result-text">' +
            '<p class="handnote">' + esc(markWord(L.mark)) + '</p>' +
            '<p class="steplabel">Набрано ' + L.points + ' из ' + L.max + ' баллов</p>' +
            (L.game ? '<p class="steplabel">Тренировка: верно ' + L.game.ok + ' из ' + L.game.total + '</p>' : '') +
          '</div>' +
        '</div>' +
        sendStatus(L) +
      '</section>' +
      (LOCKED >= 0 ? (L.send === "ok" ? '<p class="steplabel">Тест завершён. Страницу можно закрыть.</p>' : '') : '<div class="actions">' +
        (next >= 0 ? '<button class="btn" data-action="start" data-i="' + next + '">Следующий тест: ' + esc(testLabel(STATIONS[next])) + '</button>'
                   : '<button class="btn" data-action="final">Итоговая ведомость</button>') +
        '<button class="btn ghost" data-action="home">К ведомости</button>' +
      '</div>');
  }

  function viewFinal() {
    var marks = [];
    var rows = STATIONS.map(function (st) {
      var r = S.results[st.id];
      if (r) marks.push(r.mark);
      return '<tr><td>' + esc(st.lecture) + '</td><td>' + esc(st.title) + '</td><td>' +
        (r ? '<span class="mark-sm">' + r.mark + '</span>' : '<span class="mark-empty">—</span>') + '</td></tr>';
    }).join("");
    var avg = marks.length ? marks.reduce(function (a, b) { return a + b; }, 0) / marks.length : 0;
    var avgText = avg.toFixed(1).replace(".", ",");
    var all = marks.length === STATIONS.length;
    var date = "";
    try { date = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }); } catch (e) { date = ""; }
    return '' +
      '<div class="topbar"><button class="linkbtn" data-action="home">← К ведомости</button></div>' +
      '<section class="sheet" aria-label="Итоговая ведомость">' +
        '<p class="eyebrow">Итоговая ведомость</p>' +
        '<h1>' + esc(nameOk() ? fullName() : "Участник марафона") + '</h1>' +
        '<p class="steplabel">Курс «Культурно-досуговая деятельность в школе»</p>' +
        '<div style="overflow-x:auto"><table class="cert-table"><thead><tr><th>Лекция</th><th>Тема</th><th>Отметка</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="result">' + gradeHTML(Math.round(avg)) +
          '<div class="result-text">' +
            '<p class="steplabel">Средний балл: ' + avgText + (all ? '' : ' (пройдено ' + marks.length + ' из ' + STATIONS.length + ')') + '</p>' +
            '<p class="handnote">' + esc(all ? rankTitle(avg) : 'Пройдите все четыре станции, чтобы получить звание') + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="cert-foot"><span>Досуговый марафон</span><span>' + esc(date) + '</span></div>' +
      '</section>' +
      '<div class="actions">' +
        '<button class="btn" data-action="restart">Пройти марафон заново</button>' +
        '<button class="btn ghost" data-action="home">К ведомости</button>' +
      '</div>';
  }

  /* ---------- Render ---------- */

  var app = document.getElementById("app");
  function render(focusId) {
    var html;
    if (S.view === "station" && S.run) {
      var st = STATIONS[S.run.st];
      if (S.run.step < st.quiz.length) html = viewQuiz(st, S.run);
      else if (st.game.type === "bins") html = viewBins(st, S.run);
      else html = viewOrder(st, S.run);
    } else if (S.view === "result" && S.last) {
      html = viewResult();
    } else if (S.view === "final") {
      html = viewFinal();
    } else if (S.view === "intro" && S.pendingStation >= 0) {
      html = viewIntro();
    } else if (LOCKED >= 0) {
      S.pendingStation = LOCKED; S.view = "intro";
      html = viewIntro();
    } else {
      S.view = "home";
      html = viewHome();
    }
    app.innerHTML = html;
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) { try { el.focus({ preventScroll: false }); } catch (e) { el.focus(); } }
    }
  }
  function top() { try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } }

  /* ---------- Actions ---------- */

  function startStation(i) {
    var st = STATIONS[i];
    var g = st.game;
    S.run = {
      st: i, step: 0, points: 0,
      opts: st.quiz.map(function (q) { return shuffle([q.a].concat(q.wrong)); }),
      picked: null,
      items: g && g.type === "bins" ? shuffle(g.items.map(function (_, k) { return k; })) : [],
      item: 0, binPicked: null,
      pool: g && g.type === "order" ? shuffle(g.steps.map(function (_, k) { return k; })) : [],
      placed: [], miss: false, wrongTap: null, gameOk: 0, answers: []
    };
    S.view = "station";
    render(); top();
  }
  function requestStart(i) {
    S.pendingStation = i;
    S.nameError = "";
    S.view = "intro";
    render(nameValid(S.lastName) ? "first-name" : "last-name"); top();
  }
  function begin() {
    if (!nameOk()) {
      S.nameError = "Введите фамилию и имя: только буквы, не меньше двух.";
      render(nameValid(S.lastName) ? "first-name" : "last-name");
      return;
    }
    S.nameError = "";
    S.firstName = cleanName(S.firstName);
    S.lastName = cleanName(S.lastName);
    save();
    startStation(S.pendingStation);
  }

  function finishStation() {
    var run = S.run, st = STATIONS[run.st];
    var max = stationMax(st);
    var mark = toMark(run.points, max);
    var game = st.game ? { ok: run.gameOk, total: gameTotal(st.game) } : null;
    S.attempts[st.id] = (S.attempts[st.id] || 0) + 1;
    S.results[st.id] = { points: run.points, max: max, mark: mark };
    S.last = { i: run.st, points: run.points, max: max, mark: mark, game: game,
      report: buildReport(st, run, mark, game, S.attempts[st.id]), send: "sending" };
    S.run = null;
    S.view = "result";
    save(); render(); top();
    sendLast();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b || b.disabled) return;
    var a = b.getAttribute("data-action");
    var run = S.run;
    if (LOCKED >= 0 && /^(home|final|start|reset|restart)$/.test(a)) return;
    if (a === "start") { requestStart(Number(b.getAttribute("data-i"))); return; }
    if (a === "begin") { begin(); return; }
    if (a === "resend") { sendLast(); return; }
    if (a === "home") { S.view = "home"; render(); top(); return; }
    if (a === "final") { S.view = "final"; render(); top(); return; }
    if (a === "reset" || a === "restart") {
      S.results = {}; S.last = null; S.run = null; save();
      S.view = "home"; render(); top(); return;
    }
    if (!run) return;
    var st = STATIONS[run.st];
    if (a === "pick" && run.picked === null) {
      var val = run.opts[run.step][Number(b.getAttribute("data-k"))];
      run.picked = val;
      var qi = st.quiz[run.step];
      run.answers.push({ q: qi.q, picked: val, correct: qi.a, ok: val === qi.a });
      if (val === qi.a) run.points += Q_PTS;
      render("next-btn");
    } else if (a === "next") {
      run.step++; run.picked = null;
      if (run.step >= stepsTotal(st)) finishStation(); else { render(); top(); }
    } else if (a === "bin" && run.binPicked === null) {
      var bid = b.getAttribute("data-b");
      run.binPicked = bid;
      if (bid === st.game.items[run.items[run.item]].b) run.gameOk += 1;
      render("next-btn");
    } else if (a === "nextitem") {
      run.item++; run.binPicked = null;
      if (run.item >= st.game.items.length) finishStation(); else render();
    } else if (a === "place") {
      var k = Number(b.getAttribute("data-k"));
      if (k === run.placed.length) {
        run.placed.push(k);
        if (!run.miss) run.gameOk += 1;
        run.miss = false; run.wrongTap = null;
        render(run.placed.length === st.game.steps.length ? "next-btn" : null);
      } else {
        run.miss = true; run.wrongTap = k;
        render();
      }
    } else if (a === "finish") {
      finishStation();
    }
  });

  app.addEventListener("input", function (e) {
    if (!e.target) return;
    if (e.target.id === "first-name") { S.firstName = e.target.value; save(); }
    if (e.target.id === "last-name") { S.lastName = e.target.value; save(); }
  });

  function stationFromHash() {
    var h = "";
    try { h = (window.location.hash || "").replace(/^#/, ""); } catch (e) { h = ""; }
    var m = /^test-([1-4])$/.exec(h);
    return m ? Number(m[1]) - 1 : -1;
  }
  function boot(data) {
    if (data && data.S && typeof data.S === "object") { S = data.S; render(); return; }
    load();
    var i = stationFromHash();
    if (i >= 0) { LOCKED = i; S.pendingStation = i; S.view = "intro"; render(); } else render();
  }
  window.addEventListener("hashchange", function () {
    var i = stationFromHash();
    if (i >= 0) { LOCKED = i; S.run = null; S.pendingStation = i; S.nameError = ""; S.view = "intro"; render(); top(); }
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && (e.target.id === "first-name" || e.target.id === "last-name") && S.view === "intro") begin();
  });
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { S: S }; }); } catch (e) { /* ignore */ }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
